# P2 access control: keep the final model's 64-channel Thin-P2 value path,
# but remove DSPR, CGRF, and SDQ. Query initialization remains DEIM-S style.
backbone:
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']] # 3-P4/16
  - [-1, HG_Stage, [128, 1024, 1, 3, True, True, 5, True, 'se']] # 4-P5/32

encoder:
  - [1, ConvNormLayer_fuse, [64, 1, 1]] # 5-thin P2/4
  - [2, ConvNormLayer_fuse, [256, 1, 1]] # 6-P3/8
  - [3, ConvNormLayer_fuse, [256, 1, 1]] # 7-P4/16
  - [4, ConvNormLayer_fuse, [256, 1, 1]] # 8-P5/32

  - [8, TransformerEncoderBlock, [8, 1024, 0.1, "relu", 10000, False]] # 9-P5/32

  - [-1, ConvNormLayer_fuse, [256, 1, 1]] # 10-P5 lateral
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 7], Concat, []] # 12-P4/16
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 13-P4/16

  - [-1, ConvNormLayer_fuse, [256, 1, 1]] # 14-P4 lateral
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 6], Concat, []] # 16-P3/8
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 17-P3/8

  - [-1, ConvNormLayer_fuse, [256, 1, 1]] # 18-P3 lateral
  - [-1, ConvNormLayer_fuse, [64, 1, 1]] # 19-P3 thin branch
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 20
  - [[-1, 5], Concat, []] # 21-P2/4
  - [-1, RepNCSPELAN4, [64, 128, 32, 1, False, 'silu']] # 22-thin P2/4

  - [-1, SCDown, [256, 3, 2, 'silu']] # 23-P3/8
  - [[-1, 18], Concat, []] # 24-P3/8
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 25-P3/8

  - [-1, SCDown, [256, 3, 2, 'silu']] # 26-P4/16
  - [[-1, 14], Concat, []] # 27-P4/16
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 28-P4/16

  - [-1, SCDown, [256, 3, 2, 'silu']] # 29-P5/32
  - [[-1, 10], Concat, []] # 30-P5/32
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 31-P5/32

decoder:
  - [[22, 25, 28, 31], DFINETransformer, {"feat_strides": [4, 8, 16, 32], "hidden_dim": 256, "num_levels": 4, "num_layers": 3, "num_points": [2, 3, 6, 3], "dim_feedforward": 1024, "sdq_levels": 0, "sdq_pre_topk": 0, "sdq_query_topk": 0}]
