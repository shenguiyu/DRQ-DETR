# VisDrone2019 sensitivity center configuration: Thin-P2-32, P1024-Q64.
# P2/P3/P4/P5 denote feature levels at 1/4, 1/8, 1/16, and 1/32 input resolution.
# Thin-P2 width = 32; SDQ uses pre_topk = 1024, query_topk = 64.
backbone:
  # [from, module, args]
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']] # 3-P4/16
  - [-1, HG_Stage, [128, 1024, 1, 3, True, True, 5, True, 'se']] # 4-P5/32

encoder:
  # Detail proxy and deep feature projections.
  - [1, ConvNormLayer_fuse, [32, 1, 1]] # 5-Thin-P2 lateral, P2/4
  - [[1, 2], DSPR, [128, 0.20, 0.50, True]] # 6-DSPR proxy, P2/4
  - [2, ConvNormLayer_fuse, [256, 1, 1]] # 7-P3/8
  - [3, ConvNormLayer_fuse, [256, 1, 1]] # 8-P4/16
  - [4, ConvNormLayer_fuse, [256, 1, 1]] # 9-P5/32

  # CGRF aligns the DSPR proxy with deeper value features.
  - [[7, 6], CGRF, [256, 0.50, False]] # 10-CGRF-enhanced P3/8
  - [[8, 6], CGRF, [256, 0.50, False]] # 11-CGRF-enhanced P4/16

  # Transformer encoder and top-down neck.
  - [9, TransformerEncoderBlock, [8, 1024, 0.1, "relu", 10000, False]] # 12-P5/32
  - [-1, ConvNormLayer_fuse, [256, 1, 1]] # 13-P5 lateral
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 11], Concat, []] # 15-P4/16
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 16-P4/16

  - [-1, ConvNormLayer_fuse, [256, 1, 1]] # 17-P4 lateral
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 10], Concat, []] # 19-P3/8
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 20-P3/8

  # Thin-P2 high-resolution value path.
  - [-1, ConvNormLayer_fuse, [256, 1, 1]] # 21-P3 lateral for bottom-up fusion
  - [-1, ConvNormLayer_fuse, [32, 1, 1]] # 22-Thin-P2 branch from P3/8
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 23
  - [[-1, 5], Concat, []] # 24-P2/4
  - [-1, RepNCSPELAN4, [32, 64, 16, 1, False, 'silu']] # 25-Thin-P2 value, P2/4

  # Bottom-up PAN path from Thin-P2 to P5.
  - [-1, SCDown, [256, 3, 2, 'silu']] # 26-P3/8
  - [[-1, 21], Concat, []] # 27-P3/8
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 28-P3/8

  - [-1, SCDown, [256, 3, 2, 'silu']] # 29-P4/16
  - [[-1, 17], Concat, []] # 30-P4/16
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 31-P4/16

  - [-1, SCDown, [256, 3, 2, 'silu']] # 32-P5/32
  - [[-1, 13], Concat, []] # 33-P5/32
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 34-P5/32

decoder:
  # Input 6 is the DSPR proxy used by SDQ. Inputs 25/28/31/34 are value features V2-V5.
  - [[6, 25, 28, 31, 34], DFINETransformer, {"feat_strides": [4, 4, 8, 16, 32], "hidden_dim": 256, "num_levels": 4, "num_layers": 3, "num_points": [2, 3, 6, 3], "dim_feedforward": 1024, "sdq_levels": 1, "sdq_pre_topk": 1024, "sdq_query_topk": 64, "sdq_grid_size": 0.025}]
